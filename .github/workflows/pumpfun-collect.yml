# Manual one-poll pump.fun collection.
# paper-hourly.yml runs a two-poll burst at :23 every two hours, with a :53 backup, and commits the data branch.
# See docs/pumpfun.md. This manual workflow stays one poll.
name: pumpfun-collect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pumpfun-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Collect public pump.fun snapshots
        run: python -m sollab pumpfun-collect --db data/sollab.db --polls 1
      - name: Report
        run: python -m sollab report --db data/sollab.db --export-dir data/exports
      - uses: actions/upload-artifact@v4
        with:
          name: sollab-pumpfun-snapshots
          path: |
            data/sollab.db
            data/exports
