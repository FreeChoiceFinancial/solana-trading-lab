# Read-only pump.fun collection. Dispatch only.
# A cron is a poor fit: pump.fun moves faster than five minutes, and a private
# repo's free Actions minutes cannot pay for a tight poll. See docs/pumpfun.md.
name: pumpfun-collect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pumpfun-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Collect public pump.fun snapshots
        run: python -m sollab pumpfun-collect --db data/sollab.db --polls 1
      - name: Report
        run: python -m sollab report --db data/sollab.db --export-dir data/exports
      - uses: actions/upload-artifact@v4
        with:
          name: sollab-pumpfun-snapshots
          path: |
            data/sollab.db
            data/exports
